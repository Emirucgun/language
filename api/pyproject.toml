[project]
name = "teacher-api"
version = "0.1.0"
description = "A1–A2 AI İngilizce öğretmeni: API ve arka plan işleri"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.4.0",
    "fastapi[standard]>=0.162.0",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Türkçe yorum ve metinler: noktasız ı karışıklık sayılmasın.
allowed-confusables = ["ı", "–"]
# SQLAlchemy bildirimsel modellerinde `__table_args__` sözlükleri bu kuralı yanlış tetikler.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture'ları başka test modülünden içe aktarılıp parametre olarak alınır: F811 yanlış alarm.
"tests/*" = ["F811"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "lemminflect>=0.2.3",
    "mypy>=2.4.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
