name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Yalnızca CI'daki geçici veritabanı için; gerçek şifre değil.
      TEST_DATABASE_URL: postgresql+psycopg://teacher_owner:ci@localhost:5432/teacher_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://teacher_app:ci@localhost:5432/teacher_test
      DATABASE_URL: postgresql+psycopg://teacher_app:ci@localhost:5432/teacher_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --locked
      - name: Rolleri ve test veritabanını kur
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE teacher_owner LOGIN PASSWORD 'ci'" \
            -c "CREATE ROLE teacher_app LOGIN PASSWORD 'ci'" \
            -c "CREATE DATABASE teacher_test OWNER teacher_owner"
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Testler (atlanan test varsa kırılır)
        run: |
          uv run pytest -q -rs | tee pytest.out
          ! grep -q "skipped" pytest.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kod değiştiyse changelog satırı var mı?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -qE '^(api|web)/' \
            && ! echo "$changed" | grep -q '^docs/changelog/CHANGELOG.md$'; then
            echo "::warning::Kod değişti ama docs/changelog/CHANGELOG.md güncellenmedi."
          fi
